# Netlify: import this repo; these settings are picked up automatically.
# Set REACT_APP_BACKEND_URL (your Render API address) in Site configuration > Environment variables.
[build]
  base = "frontend"
  command = "CI=false npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
