# Render Blueprint: New > Blueprint > pick this repo. Render asks for the values marked sync: false.
services:
  - type: web
    name: bookslot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter            # always-on (free instances sleep, which stops reminders)
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_NAME
        value: bookslot
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
